---
- name: Set up web servers
  hosts: linux_servers
  become: yes
  tasks:
    - name: Install NGINX
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Install OpenSSH server
      apt:
        name: openssh-server
        state: present

    - name: Create home page
      copy:
        content: "Hello from {{ inventory_hostname }} - configured by Ansible\n"
        dest: /var/www/html/index.html
